name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build (release)
        run: swift build -c release --disable-sandbox --build-system native

      - name: Run tests
        run: swift test --disable-sandbox --build-system native

      - name: Build universal binary
        run: swift build -c release --disable-sandbox --build-system native --arch arm64 --arch x86_64

      - name: Package DMG
        run: make dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacOSFixer-1.0.0.dmg
          path: MacOSFixer-1.0.0.dmg
